<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Portaria - Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      width: 320px;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .msg {
      margin-top: 16px;
      font-size: 14px;
      text-align: center;
    }

    .ok {
      color: green;
    }

    .erro {
      color: red;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>CRM Portaria</h1>

    <input
      type="email"
      id="email"
      placeholder="E-mail"
      value="admin@portaria.local"
    />

    <input
      type="password"
      id="password"
      placeholder="Senha"
      value="123456"
    />

    <button onclick="login()">Entrar</button>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');

      msg.className = 'msg';
      msg.textContent = 'Entrando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('accessToken', data.accessToken);
          localStorage.setItem('refreshToken', data.refreshToken);

          msg.className = 'msg ok';
          msg.textContent = 'Login realizado com sucesso! Redirecionando...';

          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 800);
        } else {
          msg.className = 'msg erro';
          msg.textContent = data.message || 'Falha no login';
        }
      } catch (err) {
        msg.className = 'msg erro';
        msg.textContent = 'Erro ao conectar com o servidor';
      }
    }
  </script>
</body>
</html>
